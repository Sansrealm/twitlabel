<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alien Account</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#0f1419; --muted:#536471; --line:#e3e8eb; --amber:#ffb224; --ink:#1c1300; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --fg:#e7e9ea; --muted:#8b98a5; --line:#2f3336; }
  }
  * { box-sizing: border-box; }
  body { margin:0; width:300px; padding:16px; background:var(--bg); color:var(--fg);
    font:400 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  h1 { margin:0 0 4px; font-size:16px; display:flex; align-items:center; gap:8px; }
  .pill { background:var(--amber); color:var(--ink); font-weight:700; font-size:11.5px; line-height:16px;
    padding:1px 8px 2px; border-radius:999px; letter-spacing:.02em; }
  p.lead { margin:0 0 14px; color:var(--muted); font-size:12.5px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
  label { font-weight:600; white-space:nowrap; }
  select { max-width:150px; font:inherit; padding:4px 6px; border-radius:8px; border:1px solid var(--line);
    background:var(--bg); color:var(--fg); }
  input[type=checkbox] { width:18px; height:18px; accent-color:var(--amber); }
  .meta { padding-top:10px; border-top:1px solid var(--line); color:var(--muted); font-size:12.5px; }
  .meta div + div { margin-top:4px; }
  #status.warn { color:#c2410c; }
  @media (prefers-color-scheme: dark) { #status.warn { color:#fb923c; } }
  button { margin-top:12px; width:100%; font:inherit; font-weight:600; padding:7px 10px; border-radius:999px;
    border:1px solid var(--line); background:transparent; color:var(--fg); cursor:pointer; }
  button:hover { border-color:var(--muted); }
</style>
</head>
<body>
  <h1>Alien Account <span class="pill">Alien account</span></h1>
  <p class="lead">Marks X accounts based outside your home country. Click a pill to see the country.</p>

  <div class="row">
    <label for="enabled">Show pills</label>
    <input type="checkbox" id="enabled">
  </div>
  <div class="row">
    <label for="home">Home country</label>
    <select id="home"></select>
  </div>
  <p class="lead" id="homehint" hidden style="margin:-4px 0 10px">Set from your computer's time zone. Change it any time.</p>

  <div class="meta">
    <div id="count"></div>
    <div id="status"></div>
  </div>
  <button id="clear" type="button">Clear saved locations</button>

  <script src="countries.js"></script>
  <script src="popup.js"></script>
</body>
</html>
